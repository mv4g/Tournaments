<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stumble Labs Admin</title>
  <style>
    /* Styles for the admin page */
    body { font-family: Arial, sans-serif; }
    #admin-page { margin: 20px; }
    #admin-page h1 { margin-top: 0; }
    #admin-page .empty { color: red; }
    .tournament-card { margin-bottom: 10px; }
    .event-image { width: 150px; height: auto; }
    .event-body { padding: 10px; }
    .event-meta { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .event-meta span { font-weight: bold; margin-right: 5px; color: #8b5cf6; }
    .event-facts span { color: #8b5cf6; margin-right: 5px; }
    .event-prize { color: #8b5cf6; font-weight: bold; }
  </style>
</head>
<body>
  <div id="admin-page">
    <h1>Stumble Labs Admin</h1>
    <div id="tournaments" class="admin-section">
      <h2>Tournaments</h2>
      <div id="t-box" class="admin-section" style="display: none;">
        <select id="t-select" class="admin-section" onchange="document.getElementById('admin-tournament').style.display = this.value">
          <option value="" selected disabled hidden>Select tournament</option>
          <!-- Tournaments will be populated here -->
        </select>
        <button class="secondary" onclick="document.getElementById('admin-tournament').style.display = 'block'">Add Tournament</button>
      </div>
      <div id="t-box" class="admin-section" style="display: none;">
        <form id="tournament-form" method="POST" action="/admin/tournament" enctype="multipart/form-data">
          <label for="t-name">Name:</label>
          <input id="t-name" type="text" name="name" required>
          <label for="t-mode">Mode:</label>
          <select id="t-mode" name="mode" required>
            <option value="1v1">1v1</option>
            <option value="2v2">2v2</option>
          </select>
          <label for="t-status">Status:</label>
          <select id="t-status" name="status" required>
            <option value="upcoming">Upcoming</option>
            <option value="live">Live</option>
            <option value="completed">Completed</option>
          </select>
          <label for="t-starts-at">Starts at:</label>
          <input id="t-starts-at" type="datetime-local" name="starts-at" required>
          <label for="t-signup">Signup starts at:</label>
          <input id="t-signup" type="datetime-local" name="signup-starts-at" required>
          <label for="t-image">Image URL:</label>
          <input id="t-image" type="text" name="image-url" required>
          <label for="t-color">Color:</label>
          <input id="t-color" type="color" name="color" required>
          <label for="t-party">Party Size:</label>
          <input id="t-party" type="number" name="party-size" min="1" max="16" required>
          <label for="t-maxplayers">Max Players:</label>
          <input id="t-maxplayers" type="number" name="max-players" min="1" max="16" required>
          <label for="t-entryfee">Entry Fee:</label>
          <input id="t-entryfee" type="number" name="entry-fee" min="0" max="100" required>
          <label for="t-prizetype">Prize Type:</label>
          <input id="t-prizetype" type="text" name="prize-type" required>
          <label for="t-prizepool">Prize Pool:</label>
          <input id="t-prizepool" type="text" name="prize-pool" required>
          <label for="t-region">Region:</label>
          <input id="t-region" type="text" name="region" required>
          <label for="t-type">Type:</label>
          <input id="t-type" type="text" name="type" required>
          <label for="t-rounds">Rounds:</label>
          <input id="t-rounds" type="number" name="total-rounds" min="1" max="100" required>
          <label for="t-maxteams">Max Teams:</label>
          <input id="t-maxteams" type="number" name="max-teams" min="1" max="16" required>
          <label for="t-groups">Groups:</label>
          <input id="t-groups" type="number" name="number-groups" min="1" max="10" required>
          <label for="t-stream">Stream URL:</label>
          <input id="t-stream" type="text" name="stream-url" required>
          <label for="t-invited">Invited Users:</label>
          <input id="t-invited" type="text" name="invited-users" required>
          <label for="t-maps">Maps:</label>
          <input id="t-maps" type="text" name="maps" required>
          <label for="t-description">Description:</label>
          <textarea id="t-description" name="description" required></textarea>
          <label for="t-phases">Phases:</label>
          <textarea id="t-phases" name="phase-config" required></textarea>
          <label for="t-phasegroups">Enable Phase Groups:</label>
          <input id="t-phasegroups" type="checkbox" name="enable-phase-groups" required>
          <label for="t-leaderboard">Count on Leaderboard:</label>
          <input id="t-leaderboard" type="checkbox" name="count-on-leaderboard" required>
          <label for="t-invitation">Invitation Only:</label>
          <input id="t-invitation" type="checkbox" name="invitation-only" required>
          <label for="t-emotes">Enable Emotes:</label>
          <input id="t-emotes" type="checkbox" name="enable-emotes" required>
          <div id="emotes" style="display: none;">
            <input id="GG" type="checkbox" name="enabled-emotes" value="GG">
            <label for="GG">GG</label>
            <input id="Clap" type="checkbox" name="enabled-emotes" value="Clap">
            <label for="Clap">Clap</label>
            <input id="Heart" type="checkbox" name="enabled-emotes" value="Heart">
            <label for="Heart">Heart</label>
            <input id="Laugh" type="checkbox" name="enabled-emotes" value="Laugh">
            <label for="Laugh">Laugh</label>
          </div>
          <div id="tournament-submit" style="display: none;">
            <button id="t-submit" type="submit">Save Changes</button>
            <button id="t-cancel" type="button" style="display: none">Cancel</button>
          </div>
        </form>
      </div>

            <input id="Laugh" type="checkbox" name="enabled-emotes" value="Laugh">

          </div>

            <button id="t-submit" type="submit">Update</button>

          </div>

      </div>
